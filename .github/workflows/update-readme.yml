name: Update README

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: # manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update recent activity
        uses: Readme-Workflows/recent-activity@v2.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "chore: update recent activity"
          MAX_LINES: 5

      - name: Update profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: JasonWarrenUK
          BRANCH_NAME: main
          UTC_OFFSET: 0

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: "user=JasonWarrenUK&theme=gruvbox&hide_border=false"
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake contribution graph
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: JasonWarrenUK
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=#fabd2f
            assets/snake-light.svg?palette=github

      - name: Commit generated assets
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          commit_message: "chore: regenerate streak + snake SVGs"
          file_pattern: "assets/streak.svg assets/snake.svg assets/snake-light.svg"
